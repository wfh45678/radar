name: Release

# 打 tag（v*）时构建 Docker 镜像推 GHCR，并创建 GitHub Release（说明取自 CHANGELOG.md）。
# 手动触发用于补发：workflow_dispatch 传入已存在的 tag（如 v3.0.0），
# 避免 ref_name 落在分支上导致镜像误打分支标签。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v3.0.0，须已存在于仓库）'
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 发布件保险：打包前重建前端（产物已提交于 static/，CI 已校验同步，此处冗余兜底）
      - name: Build frontend
        run: bash scripts/build-frontend.sh

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      # SDK 先 install（两段构建约定，同 ci.yml），主工程 package 才能解析 radar-plugin-api
      - name: Install radar-plugin-api SDK
        run: mvn -B -s .mvn/settings.xml -f radar-plugin-api/pom.xml install -DskipTests

      # 质量门禁在 CI workflow（PR/push 已跑全量测试）；此处仅产出发布件
      - name: Package
        run: mvn -B -s .mvn/settings.xml package -DskipTests

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
            ghcr.io/${{ github.repository }}:latest

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${RELEASE_TAG#v}"
          sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '$d' > release-notes.md
          [ -s release-notes.md ] || echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)." > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
