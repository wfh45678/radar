# E2E 冒烟（v3.3 开源基建 T3）：compose 起全套环境（应用本地构建、验证码免检）→ Playwright 五步冒烟。
# 触发：push master + 手动。PR 阶段不跑（体量大），回归由 L1/L2 + 覆盖门禁把关。
name: E2E Smoke

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      # 两段构建约定：SDK 先 install；依赖解析偶发外呼抖动，失败重试一次
      - name: Build app jar
        run: |
          mvn -B -ntp -s .mvn/settings.xml -f radar-plugin-api/pom.xml install -Dgpg.skip=true
          mvn -B -ntp -s .mvn/settings.xml package -DskipTests || \
            { echo "::notice::build retry after transient failure"; sleep 30; mvn -B -ntp -s .mvn/settings.xml package -DskipTests; }

      # 诊断轮：单命令单步骤，失败步骤名即失败命令（可经 API 步骤明细定位，无需日志）
      - name: Docker daemon
        run: |
          docker info --format 'daemon ok: {{.ServerVersion}}'

      - name: Compose plugin
        run: docker compose version

      - name: Compose config
        run: docker compose config

      - name: Start compose stack (captcha off)
        env:
          SYSCONF_CAPTCHAENABLED: "false"
          # compose 的 --profile 旗标在 runner 版本上不受支持（unknown flag），
          # 改用全版本通用的 COMPOSE_PROFILES 环境变量
          COMPOSE_PROFILES: "app"
        run: |
          set +e
          set -o pipefail
          docker compose up -d --build 2>&1 | tee /tmp/compose-up.log
          code=$?
          if [ $code -ne 0 ]; then
            tail -30 /tmp/compose-up.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line:0:200}"
            done
            exit $code
          fi

      - name: Wait for app health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:6580/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "app healthy after $((i*5))s"; exit 0
            fi
            sleep 5
          done
          docker compose logs app 2>&1 | tail -40 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line:0:200}"
          done
          echo "app not healthy in 300s"; exit 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Playwright smoke
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          set +e
          npx playwright test 2>&1 | tee /tmp/pw.log
          code=$?
          if [ $code -ne 0 ]; then
            # 失败用例摘要转注解（匿名可读）
            grep -E "^  [✘✔]|Error:|expect\(|Timed out|Test timeout|✓" /tmp/pw.log | tail -20 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line:0:200}"
            done
            exit $code
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
