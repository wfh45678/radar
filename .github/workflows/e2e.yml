# E2E 冒烟（v3.3 开源基建 T3）：compose 起全套环境（应用本地构建、验证码免检）→ Playwright 五步冒烟。
# 触发：push master + 手动。PR 阶段不跑（体量大），回归由 L1/L2 + 覆盖门禁把关。
name: E2E Smoke

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      # 两段构建约定：SDK 先 install；依赖解析偶发外呼抖动，失败重试一次
      - name: Build app jar
        run: |
          mvn -B -ntp -s .mvn/settings.xml -f radar-plugin-api/pom.xml install -Dgpg.skip=true
          mvn -B -ntp -s .mvn/settings.xml package -DskipTests || \
            { echo "::notice::build retry after transient failure"; sleep 30; mvn -B -ntp -s .mvn/settings.xml package -DskipTests; }

      - name: Start compose stack (captcha off)
        env:
          SYSCONF_CAPTCHAENABLED: "false"
        run: |
          # 四轮 0s 失败 + exit 1（CLI 在、daemon 不可达）：确保 daemon 运行并等待就绪（dockerd 就绪需数秒）
          if ! docker info > /dev/null 2>&1; then
            echo "::notice::docker daemon unreachable, starting"
            sudo systemctl start docker || sudo service docker start
            for i in $(seq 1 30); do
              if docker info > /dev/null 2>&1; then
                echo "daemon ready after $((i*2))s"
                break
              fi
              sleep 2
            done
          fi
          docker info --format 'daemon ok: {{.ServerVersion}}'
          # compose 插件缺失自装（用户级目录免 sudo）
          docker compose version || {
            echo "::notice::compose plugin missing, installing"
            mkdir -p "$HOME/.docker/cli-plugins"
            curl -fL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
              -o "$HOME/.docker/cli-plugins/docker-compose"
            chmod +x "$HOME/.docker/cli-plugins/docker-compose"
            docker compose version
          }
          docker compose config -q && echo "compose config valid"
          docker compose up -d --build --profile app

      - name: Wait for app health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:6580/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "app healthy after $((i*5))s"; exit 0
            fi
            sleep 5
          done
          echo "app not healthy in 300s"; docker compose logs app | tail -200; exit 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Playwright smoke
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
