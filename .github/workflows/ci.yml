name: CI

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 前端构建产物提交于 src/main/resources/static/（沿用历史约定，mvn package 无需 node）。
      # 此处重建并校验未漂移：改动 frontend/ 源码后必须重跑 scripts/build-frontend.sh 一并提交
      - name: Build frontend and check artifact sync
        run: |
          node scripts/scan-jsx.js
          bash scripts/build-frontend.sh
          git diff --exit-code -- src/main/resources/static

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      # env.CI=true 由 GitHub Actions 内置，pom 的 ci profile 自动激活：
      # surefire 不再排除 @Tag("integration")，L1/L2/L3 全量执行（Testcontainers 四件套）
      # radar-plugin-api 是独立 SDK 工程（不在 reactor），主工程编译前先 install 到本地仓
      # （两段构建约定见 docs/plugin-dev-guide.md；install 会覆盖缓存恢复的旧版本，无时效问题）
      - name: Install radar-plugin-api SDK
        run: mvn -B -s .mvn/settings.xml -f radar-plugin-api/pom.xml install -Dgpg.skip=true

      - name: Build and verify
        run: |
          set +e
          set -o pipefail
          mvn -B -ntp -s .mvn/settings.xml verify 2>&1 | tee /tmp/mvn-verify.log
          code=$?
          if [ $code -ne 0 ]; then
            # 测试失败详情转注解（匿名 API 可读，无需日志权限）
            grep -E "<<< (FAILURE|ERROR)!|AssertionFailedError|Data truncation|SQL: INSERT INTO" /tmp/mvn-verify.log | tail -15 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line:0:1000}"
            done
            # 失败测试类的 surefire 报告全文（含完整异常栈）
            for report in target/surefire-reports/*.txt; do
              if grep -qE "<<< (FAILURE|ERROR)!" /tmp/mvn-verify.log && grep -q "Tests run.*Failures: [1-9]\|Errors: [1-9]" "$report" 2>/dev/null; then
                cat "$report" | while IFS= read -r line; do
                  [ -n "$line" ] && echo "::error::${line:0:1000}"
                done
              fi
            done
            exit $code
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7
