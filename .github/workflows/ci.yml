name: CI

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 前端构建产物提交于 src/main/resources/static/（沿用历史约定，mvn package 无需 node）。
      # 此处重建并校验未漂移：改动 frontend/ 源码后必须重跑 scripts/build-frontend.sh 一并提交
      - name: Build frontend and check artifact sync
        run: |
          bash scripts/build-frontend.sh
          git diff --exit-code -- src/main/resources/static

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      # env.CI=true 由 GitHub Actions 内置，pom 的 ci profile 自动激活：
      # surefire 不再排除 @Tag("integration")，L1/L2/L3 全量执行（Testcontainers 四件套）
      - name: Build and verify
        run: mvn -B -s .mvn/settings.xml verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7
